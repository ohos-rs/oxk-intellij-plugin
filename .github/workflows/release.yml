name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      notes:
        description: Optional release notes
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Upload Release
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ohos
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plugin
        run: ./gradlew buildPlugin --console=plain

      - name: Prepare Release Notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          {
            if [[ -n "${INPUT_NOTES}" ]]; then
              printf '%s\n\n' "${INPUT_NOTES}"
            fi

            if [[ -n "${previous_tag}" ]]; then
              printf 'Changes since %s:\n' "${previous_tag}"
              git log --pretty='- %h %s' "${previous_tag}..HEAD"
            else
              printf 'Changes:\n'
              git log --pretty='- %h %s'
            fi
          } > release-notes.md

          {
            printf 'version=%s\n' "${VERSION}"
            printf 'tag=%s\n' "${tag}"
            printf 'previous_tag=%s\n' "${previous_tag:-none}"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'branch=ohos\n'
            printf '\nDistributions:\n'
            ls -lh build/distributions
          } > release-build.log

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create Tag
        env:
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: gh release create "${TAG}" build/distributions/*.zip release-build.log --target ohos --title "${TAG}" --notes-file release-notes.md
